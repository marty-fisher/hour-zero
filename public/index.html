<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hour-zero Live Dashboard</title>
    <!-- Tailwind CSS (CDN for simple prototype) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">
    <div class="max-w-md mx-auto p-4 pt-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-blue-400 mb-1">hour-zero</h1>
            <p class="text-gray-400 text-sm">Live Reel Tracking & Projection</p>
        </header>

        <!-- Status Card -->
        <div id="statusCard" class="bg-gray-800 rounded-xl p-5 mb-6 shadow-lg border border-gray-700">
            <div class="mb-4">
                <h2 id="captionDisplay" class="text-lg font-bold text-gray-200 break-words leading-tight">Loading...</h2>
                <div id="datePostedDisplay" class="text-xs text-gray-400 mt-1"></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <span class="block text-sm text-gray-400 mb-1">Current VPM</span>
                    <span id="currentVpm" class="text-2xl font-bold text-white">--</span>
                </div>
                <div>
                    <span class="block text-sm text-gray-400 mb-1">24h Projection</span>
                    <span id="projectedViews" class="text-2xl font-bold text-green-400">--</span>
                </div>
            </div>
        </div>

        <!-- Chart Container -->
        <div class="bg-gray-800 rounded-xl p-4 shadow-lg border border-gray-700">
            <h2 class="text-sm text-gray-400 mb-4">Velocity Curve (VPM)</h2>
            <div class="relative h-64 w-full">
                <canvas id="velocityChart"></canvas>
            </div>
            <div class="mt-4 text-xs text-gray-500 text-center" id="lastUpdated">
                Last Updated: --
            </div>
        </div>
        
        <!-- Cumulative Chart Container -->
        <div class="bg-gray-800 rounded-xl p-4 mt-6 shadow-lg border border-gray-700">
            <h2 class="text-sm text-gray-400 mb-4">Cumulative Views</h2>
            <div class="relative h-64 w-full">
                <canvas id="cumulativeChart"></canvas>
            </div>
        </div>

        <!-- No Data State (Hidden initially) -->
        <div id="noDataState" class="hidden mt-8 text-center text-gray-500">
            <p>No active reel currently tracking.</p>
        </div>
    </div>

    <script>
        // Fetch the statically exported JSON file
        async function loadData() {
            try {
                // In a Github Pages context, this would live under the repo root or gh-pages branch
                // We're expecting data.json to sit next to this HTML file for now
                const response = await fetch('data.json');
                const data = await response.json();
                
                if (data.status === "no_active_reel") {
                    showNoData();
                    return;
                }
                
                updateUI(data);
            } catch (error) {
                console.error("Error loading data.json:", error);
                document.getElementById('reelIdDisplay').innerText = "Error loading data";
            }
        }

        function showNoData() {
            document.getElementById('statusCard').classList.add('hidden');
            document.querySelector('.bg-gray-800.rounded-xl.p-4').classList.add('hidden');
            document.getElementById('noDataState').classList.remove('hidden');
        }

        function updateUI(data) {
            // Update Card Info
            const captionText = data.caption ? data.caption : data.reel_id;
            document.getElementById('captionDisplay').innerText = captionText;

            if (data.posted_at) {
                const date = new Date(data.posted_at);
                document.getElementById('datePostedDisplay').innerText = `Posted: ${date.toLocaleString()}`;
            }
            
            const points = data.current_trajectory;
            if(points && points.length > 0) {
                const latest = points[points.length - 1];
                document.getElementById('currentVpm').innerText = latest.velocity ? latest.velocity.toFixed(2) : "0.0";
                
                if(data['24h_predicted_views']) {
                    document.getElementById('projectedViews').innerText = Math.round(data['24h_predicted_views']).toLocaleString();
                }

                document.getElementById('lastUpdated').innerText = `Tracker Age: ${latest.age_minutes}m`;
                // Draw Chart
                renderChart(points);
            }
        }

        let chartInstance = null;
        let cumulativeChartInstance = null;
        function renderChart(points) {
            const first90mPoints = points.filter(p => p.age_minutes <= 90);
            
            const ctx = document.getElementById('velocityChart').getContext('2d');
            
            const labels = first90mPoints.map(p => `${p.age_minutes}m`);
            const vpmData = first90mPoints.map(p => p.velocity);

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Velocity (VPM)',
                        data: vpmData,
                        borderColor: 'rgb(96, 165, 250)', // Tailwind blue-400
                        backgroundColor: 'rgba(96, 165, 250, 0.1)',
                        borderWidth: 2,
                        pointRadius: 1,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#9ca3af', maxTicksLimit: 6 } // gray-400
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#9ca3af' }
                        }
                    }
                }
            });

            // Cumulative Chart
            const cumulativeCtx = document.getElementById('cumulativeChart').getContext('2d');
            const allLabels = points.map(p => `${p.age_minutes}m`);
            let accum = 0;
            const cumulativeData = points.map(p => {
                accum += p.velocity;
                return accum;
            });

            if (cumulativeChartInstance) {
                cumulativeChartInstance.destroy();
            }

            cumulativeChartInstance = new Chart(cumulativeCtx, {
                type: 'line',
                data: {
                    labels: allLabels,
                    datasets: [{
                        label: 'Cumulative Views',
                        data: cumulativeData,
                        borderColor: 'rgb(52, 211, 153)', // Tailwind emerald-400
                        backgroundColor: 'rgba(52, 211, 153, 0.1)',
                        borderWidth: 2,
                        pointRadius: 1,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#9ca3af', maxTicksLimit: 6 }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#9ca3af' }
                        }
                    }
                }
            });
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
