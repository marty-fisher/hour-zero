<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hour-zero Live Dashboard</title>
    <!-- Tailwind CSS (CDN for simple prototype) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">
    <div class="max-w-md mx-auto p-4 pt-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-blue-400 mb-1">hour-zero</h1>
            <p class="text-gray-400 text-sm">Live Reel Tracking & Projection</p>
        </header>

        <!-- Status Card -->
        <div id="statusCard" class="bg-gray-800 rounded-xl p-5 mb-6 shadow-lg border border-gray-700">
            <div class="mb-4">
                <div id="datePostedDisplay" class="text-xs text-gray-400 mt-1"></div>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mb-4 pb-4 border-b border-gray-700">
                <div>
                    <span class="block text-sm text-gray-400 mb-1">Age</span>
                    <span id="currentAge" class="text-2xl font-bold text-white">--</span>
                </div>
                <div>
                    <span class="block text-sm text-gray-400 mb-1">Current Views</span>
                    <span id="currentViews" class="text-2xl font-bold text-white">--</span>
                </div>
            </div>

            <div>
                <span class="block text-sm text-gray-400 mb-2">24h Projection History</span>
                <div class="grid grid-cols-4 gap-2 text-center border-b border-gray-700 pb-3 mb-3">
                    <div class="bg-gray-700/50 rounded p-2">
                        <span class="block text-xs text-gray-400">@ 15m</span>
                        <span id="pred15m" class="text-lg font-bold text-blue-300">--</span>
                    </div>
                    <div class="bg-gray-700/50 rounded p-2">
                        <span class="block text-xs text-gray-400">@ 30m</span>
                        <span id="pred30m" class="text-lg font-bold text-blue-300">--</span>
                    </div>
                    <div class="bg-gray-700/50 rounded p-2">
                        <span class="block text-xs text-gray-400">@ 45m</span>
                        <span id="pred45m" class="text-lg font-bold text-blue-300">--</span>
                    </div>
                    <div class="bg-gray-700/50 rounded p-2">
                        <span class="block text-xs text-gray-400">@ 60m</span>
                        <span id="pred60m" class="text-lg font-bold text-blue-300">--</span>
                    </div>
                </div>
                <div class="text-center bg-gray-800/80 rounded p-3 border border-gray-600 shadow-inner">
                    <span class="block text-sm text-gray-400 mb-1">Current 24h Prediction</span>
                    <span id="projectedViews" class="text-3xl font-bold text-green-400">--</span>
                </div>
            </div>
        </div>

        <!-- Chart Container -->
        <div class="bg-gray-800 rounded-xl p-4 shadow-lg border border-gray-700">
            <h2 class="text-sm text-gray-400 mb-4">Velocity Curve (VPM)</h2>
            <div class="relative h-64 w-full">
                <canvas id="velocityChart"></canvas>
            </div>
            <div class="mt-4 text-xs text-gray-500 text-center" id="lastUpdated">
                Last Updated: --
            </div>
        </div>
        
        <!-- Cumulative Chart Container -->
        <div class="bg-gray-800 rounded-xl p-4 mt-6 shadow-lg border border-gray-700">
            <h2 class="text-sm text-gray-400 mb-4">Cumulative Views</h2>
            <div class="relative h-64 w-full">
                <canvas id="cumulativeChart"></canvas>
            </div>
        </div>

        <!-- No Data State (Hidden initially) -->
        <div id="noDataState" class="hidden mt-8 text-center text-gray-500">
            <p>No active reel currently tracking.</p>
        </div>
    </div>

    <script>
        // Fetch the statically exported JSON file
        async function loadData() {
            try {
                // In a Github Pages context, this would live under the repo root or gh-pages branch
                // We're expecting data.json to sit next to this HTML file for now
                const response = await fetch('data.json');
                const data = await response.json();
                
                if (data.status === "no_active_reel") {
                    showNoData();
                    return;
                }
                
                updateUI(data);
            } catch (error) {
                console.error("Error loading data.json:", error);
                document.getElementById('reelIdDisplay').innerText = "Error loading data";
            }
        }

        function showNoData() {
            document.getElementById('statusCard').classList.add('hidden');
            document.querySelector('.bg-gray-800.rounded-xl.p-4').classList.add('hidden');
            document.getElementById('noDataState').classList.remove('hidden');
        }

        function updateUI(data) {
            // Update Card Info
            if (data.posted_at) {
                const date = new Date(data.posted_at);
                document.getElementById('datePostedDisplay').innerText = `Posted: ${date.toLocaleString()}`;
            }
            
            if (data.age_minutes !== undefined) {
                const hours = Math.floor(data.age_minutes / 60);
                const minutes = data.age_minutes % 60;
                document.getElementById('currentAge').innerText = `${hours}h ${minutes}m`;
            }

            if (data.current_views !== undefined) {
                document.getElementById('currentViews').innerText = data.current_views.toLocaleString();
            }

            if (data.predictions) {
                document.getElementById('pred15m').innerText = data.predictions["15m"] ? Math.round(data.predictions["15m"]).toLocaleString() : "--";
                document.getElementById('pred30m').innerText = data.predictions["30m"] ? Math.round(data.predictions["30m"]).toLocaleString() : "--";
                document.getElementById('pred45m').innerText = data.predictions["45m"] ? Math.round(data.predictions["45m"]).toLocaleString() : "--";
                document.getElementById('pred60m').innerText = data.predictions["60m"] ? Math.round(data.predictions["60m"]).toLocaleString() : "--";
                document.getElementById('projectedViews').innerText = data.predictions["current"] ? Math.round(data.predictions["current"]).toLocaleString() : "--";
            }
            
            const points = data.current_trajectory;
            if(points && points.length > 0) {
                const latest = points[points.length - 1];               
                document.getElementById('lastUpdated').innerText = `Tracker Age: ${latest.age_minutes}m`;
                // Draw Chart
                renderChart(points, data.predictions);
            }
        }

        let chartInstance = null;
        let cumulativeChartInstance = null;
        function renderChart(points, predictions) {
            const first90mPoints = points.filter(p => p.age_minutes <= 90);
            
            const ctx = document.getElementById('velocityChart').getContext('2d');
            
            const labels = first90mPoints.map(p => `${p.age_minutes}m`);
            const vpmData = first90mPoints.map(p => p.velocity);

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Velocity (VPM)',
                        data: vpmData,
                        borderColor: 'rgb(96, 165, 250)', // Tailwind blue-400
                        backgroundColor: 'rgba(96, 165, 250, 0.1)',
                        borderWidth: 2,
                        pointRadius: 1,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#9ca3af', maxTicksLimit: 6 } // gray-400
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#9ca3af' }
                        }
                    }
                }
            });

            // Cumulative Chart
            const cumulativeCtx = document.getElementById('cumulativeChart').getContext('2d');
            
            // Build x-axis up to 24 hours (1440 mins) at reasonable intervals (e.g. 15min)
            const allLabels = [];
            for (let i = 0; i <= 1440; i += 15) {
                allLabels.push(`${i}m`);
            }
            
            // Map true data to these labels
            const getTrueData = (min) => {
                // Find nearest point within this interval
                const pt = points.find(p => p.age_minutes >= min && p.age_minutes < min + 15);
                if (pt) return pt.views;
                
                // If past our current tracking max or before 0, return null
                if (points.length && min > points[points.length-1].age_minutes) return null;
                
                // Find nearest match backwards for fill
                const prev = points.filter(p => p.age_minutes <= min);
                if (prev.length > 0) return prev[prev.length - 1].views;
                return 0;
            };

            const cumulativeData = [];
            for (let i = 0; i <= 1440; i += 15) {
                cumulativeData.push(getTrueData(i));
            }
            
            // Render predictions iteratively if predictions exist
            if (predictions) {
                // To accurately render exponential curves from the backend, we recalculate the curve based on the formula
                // since the backend only provides the final 24h number.
                const baseline_half_life = 590.0;
                let decay_constant = Math.log(2) / baseline_half_life; // We use the baseline, backend uses dynamic but this creates the visual curve.
                
                const createProjectionLine = (currentViews, predictedFinalViews, currentMins) => {
                    return allLabels.map(labelStr => {
                        const min = parseInt(labelStr.replace('m',''));
                        if (min < currentMins) return null; // Only project forward
                        if (min === currentMins) return currentViews; // Start from current
                        
                        // We must reconstruct the exponential curve up to the final target
                        // The backend gave us `predictedFinalViews` at 1440m.
                        // We'll interpolate using the exponential shape instead of straight lines.
                        
                        const remainingMinsTotal = 1440 - currentMins;
                        const elapsedMinsSinceProj = min - currentMins;
                        const predictedAdditionalViews = predictedFinalViews - currentViews;
                        
                        // the ratio of accumulation at time `t` over total accumulation at 24h
                        // Accum(t) = (V0/k) * (1 - e^-kt)
                        // Accum(24h) = (V0/k) * (1 - e^-k*total)
                        // Ratio = (1 - e^-kt) / (1 - e^-k*total)
                        
                        const ratio = (1 - Math.exp(-decay_constant * elapsedMinsSinceProj)) / (1 - Math.exp(-decay_constant * remainingMinsTotal));
                        
                        const viewsAtMin = currentViews + (predictedAdditionalViews * ratio);
                        return viewsAtMin;
                    });
                };

                const datasets = [{
                    label: 'True Views',
                    data: cumulativeData,
                    borderColor: 'rgb(52, 211, 153)', // Tailwind emerald-400
                    backgroundColor: 'rgba(52, 211, 153, 0.1)',
                    borderWidth: 3,
                    pointRadius: 0, // hide dots for smooth line
                    fill: true,
                    tension: 0.4,
                    z: 10 // bring to front
                }];

                if (predictions) {
                    // Get starting point views for each prediction
                    const valAt15 = getTrueData(15);
                    if (valAt15 && predictions["15m"]) {
                        datasets.push({
                            label: 'Proj @ 15m',
                            data: createProjectionLine(valAt15, predictions["15m"], 15),
                            borderColor: 'rgba(96, 165, 250, 0.4)', // blue-400 faded
                            borderWidth: 1,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: false
                        });
                    }
                    
                    const valAt30 = getTrueData(30);
                    if (valAt30 && predictions["30m"]) {
                        datasets.push({
                            label: 'Proj @ 30m',
                            data: createProjectionLine(valAt30, predictions["30m"], 30),
                            borderColor: 'rgba(167, 139, 250, 0.4)', // purple-400 faded
                            borderWidth: 1,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: false
                        });
                    }

                    const valAt45 = getTrueData(45);
                    if (valAt45 && predictions["45m"]) {
                        datasets.push({
                            label: 'Proj @ 45m',
                            data: createProjectionLine(valAt45, predictions["45m"], 45),
                            borderColor: 'rgba(244, 114, 182, 0.4)', // pink-400 faded
                            borderWidth: 1,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: false
                        });
                    }

                    const valAt60 = getTrueData(60);
                    if (valAt60 && predictions["60m"]) {
                        datasets.push({
                            label: 'Proj @ 60m',
                            data: createProjectionLine(valAt60, predictions["60m"], 60),
                            borderColor: 'rgba(251, 146, 60, 0.4)', // orange-400 faded
                            borderWidth: 1,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: false
                        });
                    }
                    
                    if (points.length > 0 && predictions["current"]) {
                        const latest = points[points.length - 1];
                        // Find nearest 15m interval for the "current" projection line start
                        const currentMins = Math.floor(latest.age_minutes / 15) * 15;
                        datasets.push({
                            label: 'Current Proj',
                            data: createProjectionLine(latest.views, predictions["current"], currentMins),
                            borderColor: 'rgba(250, 204, 21, 0.8)', // yellow-400
                            borderWidth: 2,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: false,
                            z: 5
                        });
                    }
                }
            }

            if (cumulativeChartInstance) {
                cumulativeChartInstance.destroy();
            }

            cumulativeChartInstance = new Chart(cumulativeCtx, {
                type: 'line',
                data: {
                    labels: allLabels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { 
                            display: true,
                            position: 'bottom',
                            labels: {
                                color: '#9ca3af',
                                usePointStyle: true,
                                boxWidth: 6
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { 
                                color: '#9ca3af',
                                maxTicksLimit: 8,
                                callback: function(value, index, values) {
                                    // only show hours
                                    const min = parseInt(this.getLabelForValue(value).replace('m',''));
                                    if (min % 120 === 0) return `${min/60}h`; 
                                    return '';
                                }
                            }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#9ca3af' }
                        }
                    }
                }
            });
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
