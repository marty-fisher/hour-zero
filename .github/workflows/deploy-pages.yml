name: Deploy hour-zero Dashboard

on:
  # Run on changes to the static site or export script
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  
  # Run automatically every 15 minutes to keep data fresh
  schedule:
    - cron: "*/15 * * * *"
  
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: Fetch and Run Export Script
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Write the script explicitly in CI because it is removed from public tracking
          cat << 'EOF' > export_static_data.py
          import argparse
          import os
          import json
          import psycopg2
          from dotenv import load_dotenv

          def export_active_reel(output_path):
              db_url = os.getenv('SUPABASE_DB_URL')
              if not db_url: return
              
              # Clean any accidental trailing newlines from GitHub Secrets
              db_url = db_url.strip()
              
              # Add SSL requirement for Supabase
              if "?sslmode=" not in db_url:
                  db_url += "?sslmode=require"
              
              conn = psycopg2.connect(db_url)
              cur = conn.cursor()
              
              cur.execute("SELECT active_reel_id FROM public.tracking_state WHERE id = 1;")
              active_id = cur.fetchone()[0]
              if not active_id: return
              
              query = """
                  SELECT
                      EXTRACT(EPOCH FROM (p.polled_at - r.posted_at))::INT / 60 AS age_minutes,
                      p.velocity,
                      r.caption,
                      r.posted_at
                  FROM public.poll_metrics p
                  JOIN public.reels r ON p.reel_id = r.id
                  WHERE p.reel_id = %s
                  ORDER BY p.polled_at ASC;
              """
              cur.execute(query, (active_id,))
              rows = cur.fetchall()
              
              smoothed_points = []
              zero_accum = 0
              for r in rows:
                  age_m, vel = r[0], r[1]
                  if vel == 0:
                      zero_accum += 1
                      smoothed_points.append({"age_minutes": age_m, "velocity": 0.0})
                  else:
                      if zero_accum > 0:
                          distributed_vel = vel / (zero_accum + 1)
                          for i in range(len(smoothed_points) - zero_accum, len(smoothed_points)):
                              smoothed_points[i]["velocity"] = distributed_vel
                          smoothed_points.append({"age_minutes": age_m, "velocity": distributed_vel})
                          zero_accum = 0
                      else:
                          smoothed_points.append({"age_minutes": age_m, "velocity": vel})
              
              projected_final_views = smoothed_points[-1]["velocity"] * 1440 if smoothed_points and smoothed_points[-1]["velocity"] else 0
              
              caption = rows[0][2] if rows else ""
              posted_at = rows[0][3].isoformat() if rows and rows[0][3] else ""
              
              payload = {
                  "reel_id": active_id,
                  "caption": caption,
                  "posted_at": posted_at,
                  "current_trajectory": smoothed_points,
                  "24h_predicted_views": projected_final_views,
                  "last_updated_minutes": rows[-1][0] if rows else None
              }
              os.makedirs(os.path.dirname(output_path), exist_ok=True)
              with open(output_path, 'w') as f:
                  json.dump(payload, f, indent=2)
              conn.close()

          if __name__ == "__main__":
              export_active_reel("public/data.json")
          EOF
          
          python export_static_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
