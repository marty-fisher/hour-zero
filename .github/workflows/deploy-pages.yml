name: Deploy hour-zero Dashboard

on:
  # Run on changes to the static site or export script
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  
  # Run automatically every 15 minutes to keep data fresh
  schedule:
    - cron: "*/15 * * * *"
  
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: Fetch and Run Export Script
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Write the script explicitly in CI because it is removed from public tracking
          cat << 'EOF' > export_static_data.py
          import argparse
          import os
          import json
          import psycopg2
          from dotenv import load_dotenv

          def export_active_reel(output_path):
              db_url = os.getenv('SUPABASE_DB_URL')
              if not db_url: return
              
              # Clean any accidental trailing newlines from GitHub Secrets
              db_url = db_url.strip()
              
              # Add SSL requirement for Supabase
              if "?sslmode=" not in db_url:
                  db_url += "?sslmode=require"
              
              conn = psycopg2.connect(db_url)
              cur = conn.cursor()
              
              cur.execute("SELECT active_reel_id FROM public.tracking_state WHERE id = 1;")
              active_id = cur.fetchone()[0]
              if not active_id: return
              
              query = """
                  SELECT
                      EXTRACT(EPOCH FROM (p.polled_at - r.posted_at))::INT / 60 AS age_minutes,
                      p.velocity,
                      r.caption,
                      r.posted_at,
                      p.views
                  FROM public.poll_metrics p
                  JOIN public.reels r ON p.reel_id = r.id
                  WHERE p.reel_id = %s
                  ORDER BY p.polled_at ASC;
              """
              cur.execute(query, (active_id,))
              rows = cur.fetchall()
              
              smoothed_points = []
              zero_accum = 0
              for r in rows:
                  age_m, vel, views = r[0], r[1], r[4]
                  if vel == 0:
                      zero_accum += 1
                      smoothed_points.append({"age_minutes": age_m, "velocity": 0.0, "views": views})
                  else:
                      if zero_accum > 0:
                          distributed_vel = vel / (zero_accum + 1)
                          for i in range(len(smoothed_points) - zero_accum, len(smoothed_points)):
                              smoothed_points[i]["velocity"] = distributed_vel
                          smoothed_points.append({"age_minutes": age_m, "velocity": distributed_vel, "views": views})
                          zero_accum = 0
                      else:
                          smoothed_points.append({"age_minutes": age_m, "velocity": vel, "views": views})
              
              if smoothed_points and rows:
                  current_views = rows[-1][4]
                  current_age_minutes = smoothed_points[-1]["age_minutes"]
                  remaining_minutes = max(0, 1440 - current_age_minutes)
                  
                  # Lookback window for velocity: average the last 15 minutes of velocity.
                  recent_points = smoothed_points[-15:]
                  if recent_points:
                      current_velocity = sum(p["velocity"] for p in recent_points) / len(recent_points)
                  else:
                      current_velocity = 0
                      
                  import math
                  
                  baseline_half_life = 590.0
                  momentum_ratio = 1.0
                  if len(smoothed_points) >= 30:
                      past_15 = smoothed_points[-30:-15]
                      if past_15:
                          past_velocity = sum(p["velocity"] for p in past_15) / len(past_15)
                          if past_velocity > 0:
                              momentum_ratio = current_velocity / past_velocity
                              
                  momentum_ratio = max(0.5, min(momentum_ratio, 2.0)) 
                  half_life_minutes = baseline_half_life * momentum_ratio
                  
                  decay_constant = math.log(2) / half_life_minutes
                  
                  if decay_constant > 0:
                      accumlated_future_views = (current_velocity / decay_constant) * (1 - math.exp(-decay_constant * remaining_minutes))
                  else:
                      accumlated_future_views = current_velocity * remaining_minutes
                      
                  projected_final_views = current_views + accumlated_future_views
                  
                  # Generate historical predictions (15m, 30m, 45m)
                  def predict_at_minute(target_minute):
                      target_points = [p for p in smoothed_points if p["age_minutes"] <= target_minute]
                      target_row = next((r for r in reversed(rows) if r[0] <= target_minute), None)
                      
                      if not target_points or not target_row:
                          return None
                          
                      hist_views = target_row[4]
                      
                      # Same 15m average window for historical predictions
                      hist_recent = target_points[-15:]
                      if hist_recent:
                          hist_velocity = sum(p["velocity"] for p in hist_recent) / len(hist_recent)
                      else:
                          hist_velocity = 0
                          
                      hist_remaining = max(0, 1440 - target_minute)
                      
                      if decay_constant > 0:
                          hist_future_views = (hist_velocity / decay_constant) * (1 - math.exp(-decay_constant * hist_remaining))
                      else:
                          hist_future_views = hist_velocity * hist_remaining
                          
                      return hist_views + hist_future_views

                  pred_15m = predict_at_minute(15)
                  pred_30m = predict_at_minute(30)
                  pred_45m = predict_at_minute(45)
                  pred_60m = predict_at_minute(60)

              else:
                  current_views = 0
                  current_age_minutes = 0
                  projected_final_views = 0
                  pred_15m = None
                  pred_30m = None
                  pred_45m = None
                  pred_60m = None
                  
              caption = rows[0][2] if rows else ""
              posted_at = rows[0][3].isoformat() if rows and rows[0][3] else ""
              
              payload = {
                  "reel_id": active_id,
                  "caption": caption,
                  "posted_at": posted_at,
                  "current_trajectory": smoothed_points,
                  "current_views": current_views,
                  "age_minutes": current_age_minutes,
                  "24h_predicted_views": projected_final_views,
                  "predictions": {
                      "15m": pred_15m,
                      "30m": pred_30m,
                      "45m": pred_45m,
                      "60m": pred_60m,
                      "current": projected_final_views
                  },
                  "last_updated_minutes": rows[-1][0] if rows else None
              }
              os.makedirs(os.path.dirname(output_path), exist_ok=True)
              with open(output_path, 'w') as f:
                  json.dump(payload, f, indent=2)
              conn.close()

          if __name__ == "__main__":
              export_active_reel("public/data.json")
          EOF
          
          python export_static_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
